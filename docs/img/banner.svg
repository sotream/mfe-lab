<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">mfe-lab</title>
  <desc id="d">Federated micro frontends, built the way a platform team ships them. A shell frame hosting two independently deployed remotes, products and dashboard.</desc>
  <defs>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2129" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="#0e1116"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- wordmark -->
  <text x="72" y="168" class="mono" font-size="84" font-weight="700" fill="#f2efe9" letter-spacing="-2">mfe<tspan fill="#f0a04b">-</tspan>lab</text>
  <text x="74" y="222" class="sans" font-size="27" fill="#f2efe9">Federated micro frontends,</text>
  <text x="74" y="258" class="sans" font-size="27" fill="#8b949e">built the way a platform team ships them.</text>
  <text x="74" y="334" class="mono" font-size="15" fill="#8b949e">React 19, Module Federation 2, Rspack, TanStack Query, Fastify</text>

  <!-- shell frame -->
  <g transform="translate(708 60)">
    <rect width="500" height="300" rx="14" fill="#161b22" stroke="#2d333b" stroke-width="1.5"/>
    <path d="M0 14a14 14 0 0 1 14-14h472a14 14 0 0 1 14 14v30H0z" fill="#1c2129"/>
    <text x="22" y="28" class="mono" font-size="14" fill="#8b949e">shell · :3000</text>
    <text x="478" y="28" class="mono" font-size="14" fill="#8b949e" text-anchor="end">host</text>

    <!-- products remote -->
    <rect x="22" y="64" width="270" height="214" rx="10" fill="none" stroke="#f0a04b" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="38" y="90" class="mono" font-size="13" fill="#f0a04b">products · :3001</text>
    <g fill="#2d333b">
      <rect x="38" y="106" width="238" height="12" rx="3"/>
      <rect x="38" y="132" width="200" height="8" rx="3"/>
      <rect x="38" y="152" width="222" height="8" rx="3"/>
      <rect x="38" y="172" width="180" height="8" rx="3"/>
      <rect x="38" y="192" width="210" height="8" rx="3"/>
      <rect x="38" y="212" width="160" height="8" rx="3"/>
    </g>
    <text x="38" y="262" class="mono" font-size="12" fill="#8b949e">build 1.1.0</text>

    <!-- dashboard remote -->
    <rect x="306" y="64" width="172" height="214" rx="10" fill="none" stroke="#f0a04b" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="320" y="90" class="mono" font-size="12" fill="#f0a04b">dashboard · :3002</text>
    <g fill="#f2efe9" opacity="0.85">
      <rect x="326" y="206" width="16" height="34" rx="2"/>
      <rect x="350" y="182" width="16" height="58" rx="2"/>
      <rect x="374" y="194" width="16" height="46" rx="2"/>
      <rect x="398" y="158" width="16" height="82" rx="2"/>
      <rect x="422" y="174" width="16" height="66" rx="2"/>
      <rect x="446" y="140" width="16" height="100" rx="2"/>
    </g>
    <rect x="322" y="106" width="70" height="22" rx="3" fill="#2d333b"/>
    <rect x="400" y="106" width="62" height="22" rx="3" fill="#2d333b"/>
    <text x="322" y="262" class="mono" font-size="12" fill="#8b949e">build 2026-11-20</text>
  </g>
</svg>
