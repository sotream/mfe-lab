<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">mfe-lab</title>
  <desc id="d">Federated micro frontends, built the way a platform team ships them. A shell frame hosting three independently deployed remotes, products, dashboard and orders (Vue).</desc>
  <defs>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1b2129" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="#0e1116"/>
  <rect width="1280" height="420" fill="url(#grid)"/>

  <!-- mark: T40 geometry, 64 box scaled to 88 px, optically centred on the wordmark -->
  <g transform="translate(61 94) scale(1.375)">
    <rect x="21" y="5" width="22" height="7" rx="3.5" fill="#f2efe9"/>
    <rect x="27" y="7.6" width="10" height="1.8" rx=".9" fill="#f2b33d"/>
    <path d="M27 14h10v10l8 13.8H19L27 24z" fill="#f2efe9"/>
    <path d="M17.8 40H31v18H10.6a2.6 2.6 0 0 1-2.3-3.9z" fill="#6cb6ff"/>
    <path d="M33 40h13.2l9.5 14.1a2.6 2.6 0 0 1-2.3 3.9H33z" fill="#f2b33d"/>
  </g>

  <!-- wordmark -->
  <text x="160" y="168" class="mono" font-size="84" font-weight="700" fill="#f2efe9" letter-spacing="-2">mfe<tspan fill="#f2b33d">-</tspan>lab</text>
  <text x="162" y="222" class="sans" font-size="27" fill="#f2efe9">Federated micro frontends,</text>
  <text x="162" y="258" class="sans" font-size="27" fill="#8b949e">built the way a platform team ships them.</text>
  <text x="162" y="334" class="mono" font-size="14" fill="#8b949e">React 19 + Vue 3.5 · Module Federation 2 · Rspack · Fastify</text>

  <!-- shell frame -->
  <g transform="translate(724 60)">
    <rect width="500" height="300" rx="14" fill="#161b22" stroke="#2d333b" stroke-width="1.5"/>
    <path d="M0 14a14 14 0 0 1 14-14h472a14 14 0 0 1 14 14v30H0z" fill="#1c2129"/>
    <text x="22" y="28" class="mono" font-size="14" fill="#8b949e">shell · :3000</text>
    <text x="478" y="28" class="mono" font-size="14" fill="#8b949e" text-anchor="end">host</text>

    <!-- products remote -->
    <rect x="22" y="64" width="144" height="214" rx="10" fill="none" stroke="#f0a04b" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="36" y="90" class="mono" font-size="11" fill="#f0a04b">products · :3001</text>
    <g fill="#2d333b">
      <rect x="36" y="106" width="116" height="12" rx="3"/>
      <rect x="36" y="132" width="96" height="8" rx="3"/>
      <rect x="36" y="152" width="108" height="8" rx="3"/>
      <rect x="36" y="172" width="86" height="8" rx="3"/>
      <rect x="36" y="192" width="102" height="8" rx="3"/>
      <rect x="36" y="212" width="78" height="8" rx="3"/>
    </g>
    <text x="36" y="262" class="mono" font-size="11" fill="#8b949e">build 1.1.0</text>

    <!-- dashboard remote -->
    <rect x="178" y="64" width="144" height="214" rx="10" fill="none" stroke="#f0a04b" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="192" y="90" class="mono" font-size="11" fill="#f0a04b">dashboard · :3002</text>
    <rect x="192" y="106" width="52" height="22" rx="3" fill="#2d333b"/>
    <rect x="250" y="106" width="58" height="22" rx="3" fill="#2d333b"/>
    <g fill="#f2efe9" opacity="0.85">
      <rect x="192" y="208" width="14" height="32" rx="2"/>
      <rect x="212" y="184" width="14" height="56" rx="2"/>
      <rect x="232" y="196" width="14" height="44" rx="2"/>
      <rect x="252" y="160" width="14" height="80" rx="2"/>
      <rect x="272" y="176" width="14" height="64" rx="2"/>
      <rect x="292" y="144" width="14" height="96" rx="2"/>
    </g>
    <text x="192" y="262" class="mono" font-size="11" fill="#8b949e">build 2026-11-20</text>

    <!-- orders remote (Vue) -->
    <rect x="334" y="64" width="144" height="214" rx="10" fill="none" stroke="#f0a04b" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="348" y="90" class="mono" font-size="11" fill="#f0a04b">orders · :3003</text>
    <g fill="#2d333b">
      <rect x="348" y="106" width="116" height="12" rx="3"/>
      <rect x="348" y="130" width="116" height="22" rx="4"/>
      <rect x="348" y="158" width="116" height="22" rx="4"/>
      <rect x="348" y="186" width="116" height="22" rx="4"/>
      <rect x="348" y="214" width="116" height="22" rx="4"/>
    </g>
    <g fill="#42b883">
      <circle cx="358" cy="141" r="3"/>
      <circle cx="358" cy="169" r="3"/>
      <circle cx="358" cy="197" r="3"/>
      <circle cx="358" cy="225" r="3"/>
    </g>
    <rect x="347" y="248" width="60" height="19" rx="9.5" fill="none" stroke="#42b883" stroke-width="1.2"/>
    <text x="377" y="261.5" class="mono" font-size="11" fill="#42b883" text-anchor="middle">Vue 3.5</text>
  </g>
</svg>
