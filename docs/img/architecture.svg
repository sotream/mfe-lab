<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="t d">
  <title id="t">mfe-lab architecture</title>
  <desc id="d">A browser page hosts the shell on port 3000. At boot the shell reads GET /registry, which says per remote and user whether to load stable, canary or off. It then loads the React remotes products on 3001 and dashboard on 3002, and the Vue 3.5 remote orders on 3003, through Module Federation. React, react-dom, react-router and auth-store are shared singletons; orders takes only auth-store and renders in a Shadow DOM through mount(el, ctx). Products and dashboard talk through a typed DOM event bus. All three reach the Fastify API on 4000 through the /api proxy, and the API stores data in Postgres (Neon in production, PGlite in dev).</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; font-size: 13px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h { font-size: 15px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #57606a; }
    .c { text-anchor: middle; }
    .box { fill: #ffffff; stroke: #c9d1d9; stroke-width: 1.2; }
    .line { fill: none; stroke: #57606a; stroke-width: 1.6; }
    .dash { stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b25e09"/></marker>
  </defs>
  <rect width="1200" height="860" fill="#fbfbf9"/>
  <text x="20" y="32" class="h" style="font-size:19px">mfe-lab: one shell, three remotes, loaded at runtime</text>

  <!-- browser -->
  <rect x="20" y="48" width="1160" height="572" rx="12" fill="#f3f4f1" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="38" y="70" class="s" style="font-weight:700">BROWSER (one page, one window)</text>

  <!-- shell -->
  <rect x="40" y="82" width="1120" height="220" rx="10" fill="#eef2f9" stroke="#3b5b92" stroke-width="2"/>
  <text x="58" y="106" class="h">shell :3000</text>
  <text x="152" y="106" class="s">Module Federation host. Owns login, routing and the build stamp footer.</text>
  <rect x="58" y="118" width="1084" height="32" rx="6" class="box"/>
  <text x="72" y="139">nav: Home · Products · Dashboard · Orders · Inspector</text>
  <text x="1128" y="139" class="s" style="text-anchor:end">login form · user + token live in @mfe/auth-store</text>

  <rect x="58" y="158" width="1084" height="46" rx="6" fill="#fff" stroke="#b25e09" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="72" y="176"><tspan style="font-weight:700;fill:#7a4306">registry</tspan> <tspan class="s">at boot, GET /registry (2 s, fails open): per remote and user, load</tspan> <tspan class="mono" style="font-size:12px">stable</tspan> <tspan class="s">·</tspan> <tspan class="mono" style="font-size:12px">canary N%</tspan> <tspan class="s">·</tspan> <tspan class="mono" style="font-size:12px">off</tspan></text>
  <text x="72" y="194" class="s"><tspan style="font-weight:700;fill:#1f2328">Inspector</tspan> /inspector: remotes · versions (Use select) · canary and kill switch (admin) · shared deps · last 20 events</text>

  <rect x="58" y="214" width="340" height="76" rx="8" fill="#fff" stroke="#2f7d4f" stroke-width="2.4"/>
  <text x="74" y="238" class="h">RemoteFrame</text><text x="74" y="258" class="s">error boundary · Suspense · Retry</text><text x="74" y="276" class="s">products slot</text>
  <rect x="430" y="214" width="340" height="76" rx="8" fill="#fff" stroke="#7a4fc2" stroke-width="2.4"/>
  <text x="446" y="238" class="h">RemoteFrame</text><text x="446" y="258" class="s">error boundary · Suspense · Retry</text><text x="446" y="276" class="s">dashboard slot</text>
  <rect x="802" y="214" width="340" height="76" rx="8" fill="#fff" stroke="#c2410c" stroke-width="2.4"/>
  <text x="818" y="238" class="h">RemoteFrame + mount adapter</text><text x="818" y="258" class="s">error boundary · Suspense · Retry</text><text x="818" y="276" class="s">orders slot (Vue, mounts into a shadow root)</text>

  <!-- loadRemote arrows -->
  <path d="M228 290V420" class="line" marker-end="url(#a)"/>
  <text x="240" y="318" class="s mono">loadRemote()</text><text x="240" y="334" class="s">manifest → remoteEntry.js</text>
  <path d="M600 290V420" class="line" marker-end="url(#a)"/>
  <text x="612" y="318" class="s mono">loadRemote()</text><text x="612" y="334" class="s">manifest → remoteEntry.js</text>
  <path d="M972 290V420" class="line" marker-end="url(#a)"/>
  <text x="960" y="318" class="s mono" style="text-anchor:end">loadRemote()</text><text x="960" y="334" class="s" style="text-anchor:end">manifest → remoteEntry.js</text>

  <!-- shared singletons band -->
  <rect x="40" y="352" width="1120" height="52" rx="10" fill="#fdf3e1" stroke="#b25e09" stroke-width="1.6"/>
  <text x="58" y="374" class="h" style="fill:#7a4306">shared singletons</text><text x="58" y="392" class="s">loaded once, from the host</text>
  <g class="mono" style="font-size:12px">
    <rect x="250" y="362" width="84" height="32" rx="6" class="box"/><text x="292" y="382" class="c mono">react</text>
    <rect x="344" y="362" width="104" height="32" rx="6" class="box"/><text x="396" y="382" class="c mono">react-dom</text>
    <rect x="458" y="362" width="116" height="32" rx="6" class="box"/><text x="516" y="382" class="c mono">react-router</text>
    <rect x="584" y="362" width="140" height="32" rx="6" class="box" style="stroke:#b25e09;stroke-width:2"/><text x="654" y="382" class="c mono">@mfe/auth-store</text>
  </g>
  <text x="744" y="378" class="s">products and dashboard reuse all four;</text><text x="744" y="394" class="s">orders takes only auth-store (outlined)</text>

  <!-- products -->
  <rect x="40" y="420" width="360" height="140" rx="10" fill="#f1f8f3" stroke="#2f7d4f" stroke-width="2.6"/>
  <text x="58" y="444" class="h" style="fill:#1f5c39">products :3001</text><text x="178" y="444" class="s">exposes ./ProductsPage · React</text>
  <rect x="58" y="456" width="158" height="58" rx="7" class="box"/>
  <text x="68" y="474" style="font-weight:700">QueryClient</text><text x="68" y="491" class="s">own server-state cache</text><text x="68" y="505" class="s">per mount and per user</text>
  <rect x="224" y="456" width="160" height="58" rx="7" class="box"/>
  <text x="234" y="474" style="font-weight:700">Redux Toolkit</text><text x="234" y="491" class="s">productsUi: page, sort,</text><text x="234" y="505" class="s">search, dialogs. Local.</text>
  <rect x="58" y="522" width="326" height="28" rx="7" class="box"/>
  <text x="68" y="540"><tspan style="font-weight:700">@mfe/api-client</tspan> <tspan class="s">fetch /api/products + Bearer</tspan></text>

  <!-- dashboard -->
  <rect x="420" y="420" width="360" height="140" rx="10" fill="#f6f2fc" stroke="#7a4fc2" stroke-width="2.6"/>
  <text x="438" y="444" class="h" style="fill:#593392">dashboard :3002</text><text x="582" y="444" class="s">exposes ./DashboardPage · React</text>
  <rect x="438" y="456" width="158" height="58" rx="7" class="box"/>
  <text x="448" y="474" style="font-weight:700">QueryClient</text><text x="448" y="491" class="s">own server-state cache</text><text x="448" y="505" class="s">per mount and per user</text>
  <rect x="604" y="456" width="160" height="58" rx="7" class="box"/>
  <text x="614" y="474" style="font-weight:700">Stats view</text><text x="614" y="491" class="s">tiles, SVG orders chart,</text><text x="614" y="505" class="s">revenue by status</text>
  <rect x="438" y="522" width="326" height="28" rx="7" class="box"/>
  <text x="448" y="540"><tspan style="font-weight:700">@mfe/api-client</tspan> <tspan class="s">fetch /api/stats + Bearer</tspan></text>

  <!-- orders -->
  <rect x="800" y="420" width="360" height="140" rx="10" fill="#fdf3ec" stroke="#c2410c" stroke-width="2.6"/>
  <text x="818" y="444" class="h" style="fill:#9a3412">orders :3003</text><text x="918" y="444" class="s">Vue 3.5 · exposes ./OrdersApp</text>
  <rect x="818" y="456" width="158" height="58" rx="7" class="box"/>
  <text x="828" y="474" class="mono" style="font-weight:700;font-size:12px">mount(el, ctx)</text><text x="828" y="491" class="s">returns unmount; no</text><text x="828" y="505" class="s">React in the bundle</text>
  <rect x="984" y="456" width="160" height="58" rx="7" class="box"/>
  <text x="994" y="474" style="font-weight:700">Shadow DOM</text><text x="994" y="491" class="s">own CSS only, nothing</text><text x="994" y="505" class="s">added to document.head</text>
  <rect x="818" y="522" width="326" height="28" rx="7" class="box" style="stroke:#c2410c;stroke-dasharray:5 4"/>
  <text x="828" y="540"><tspan style="font-weight:700">no react singletons</tspan> <tspan class="s">· fetch /api/orders + Bearer</tspan></text>

  <!-- events bus: products to dashboard -->
  <path d="M340 560V592H540V562" class="line" style="stroke:#b25e09;stroke-width:2.2" marker-end="url(#ao)"/>
  <text x="440" y="582" class="c mono" style="font-size:12px;font-weight:700;fill:#7a4306">products:changed</text>
  <text x="440" y="610" class="c s">@mfe/events: DOM bus on window (not shared)</text>

  <!-- api -->
  <path d="M220 560V668H420" class="line" marker-end="url(#a)"/>
  <text x="232" y="640" class="s mono">/products</text>
  <path d="M700 560V650" class="line" marker-end="url(#a)"/>
  <text x="712" y="640" class="s mono">/stats</text>
  <path d="M980 560V668H780" class="line" marker-end="url(#a)"/>
  <text x="968" y="640" class="s mono" style="text-anchor:end">/orders</text>
  <rect x="420" y="650" width="360" height="36" rx="8" class="box"/>
  <text x="600" y="672" class="c">/api proxy (dev server or nginx, prefix stripped)</text>
  <path d="M600 686V724" class="line" marker-end="url(#a)"/>
  <text x="612" y="710" class="s">REST + Bearer JWT</text>
  <path d="M1142 204H1170V780H1000" class="line dash" style="stroke:#b25e09" marker-end="url(#ao)"/>
  <text x="1160" y="772" class="s mono" style="text-anchor:end">GET /registry</text>
  <rect x="200" y="724" width="800" height="112" rx="10" fill="#eef2f9" stroke="#3b5b92" stroke-width="2"/>
  <text x="220" y="750" class="h">api :4000</text><text x="298" y="750" class="s">Fastify · zod validation</text>
  <text x="220" y="772" class="s mono" style="font-size:12px">/products  /stats  /orders  /registry</text>
  <text x="220" y="794" class="s">JWT HS256, 15 minutes, no refresh. Roles: admin, editor, viewer.</text>
  <text x="220" y="812" class="s">Auth runs before validation; the API enforces what the UI hides.</text>
  <g>
    <path d="M800 748v56a60 14 0 0 0 120 0v-56" fill="#fff" stroke="#3b5b92" stroke-width="1.6"/>
    <ellipse cx="860" cy="748" rx="60" ry="12" fill="#fff" stroke="#3b5b92" stroke-width="1.6"/>
    <text x="860" y="774" class="c mono" style="font-size:12px">Postgres</text><text x="860" y="789" class="c s">Neon in prod</text><text x="860" y="804" class="c s">PGlite in dev</text>
  </g>
</svg>
