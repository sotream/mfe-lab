name: Preview

# A live copy of the lab per same-repo PR: shell, the remotes the PR changed, and an API on its own Neon branch.
# Preview deployments only (never --prod), under stable *.vercel.app aliases. Cleaned up when the PR closes.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

# One run per PR at a time. A new push cancels the running preview; the close run (cleanup) waits instead.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

env:
  VERCEL_CLI: vercel@66.6.0
  PR: ${{ github.event.pull_request.number }}

jobs:
  plan:
    # Not forks (no secrets), not Dependabot, not on close.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.plan.outputs.needed }}
      changed: ${{ steps.plan.outputs.changed }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: plan
        run: |
          # The merge commit is checked out; BASE_SHA..HEAD is what the PR changes.
          # Docs-, test- and CI-only PRs deploy nothing (Vercel free plan: 100 deployments a day).
          needed=$(git diff --name-only "$BASE_SHA" HEAD | node scripts/changed-apps.ts --preview-needed)
          changed=$(git diff --name-only "$BASE_SHA" HEAD | node scripts/changed-apps.ts | { grep -E '^(products|dashboard|orders)$' || true; } | tr '\n' ' ')
          echo "changed remotes: ${changed:-none}"
          {
            echo "needed=$needed"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"

  # The deploy token is never in a job that installs dependencies or builds: Link and pull (before install, no repo
  # deps) and the ship job's deploy step are the only places it appears.
  build:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      neon: ${{ steps.neon.outcome }}
    env:
      CHANGED: ${{ needs.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Link and pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -eu
          slug=$(node scripts/provision.ts vercel-scope)
          # One pulled .vercel per app, parked until the build step (which has no token).
          # shellcheck disable=SC2086
          for app in api $CHANGED shell; do
            project=mfe-lab-$app; [ "$app" != shell ] || project=mfe-lab
            rm -rf .vercel
            pnpm dlx "$VERCEL_CLI" link --yes --project "$project" --token "$VERCEL_TOKEN" ${slug:+--scope "$slug"}
            pnpm dlx "$VERCEL_CLI" pull --yes --environment=preview --token "$VERCEL_TOKEN" ${slug:+--scope "$slug"}
            mkdir -p "$RUNNER_TEMP/vc-pull"
            mv .vercel "$RUNNER_TEMP/vc-pull/$app"
          done
      - run: pnpm install --frozen-lockfile
      # Fails (and the comment says "preview unavailable") when Neon refuses, for example at the free-tier branch limit.
      - name: Neon branch
        id: neon
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/provision.ts preview-db "$PR"
      - name: Migrate
        run: pnpm --filter @mfe/api migrate
      - name: Build previews
        run: |
          set -eu
          # `vercel build` ignores vercel.json build.env, so the shell gets MF_*_URL from the environment.
          set -a
          # shellcheck disable=SC2086
          eval "$(node scripts/preview-urls.ts env "$PR" $CHANGED)"
          set +a
          build() {
            app=$1
            rm -rf .vercel
            cp -R "$RUNNER_TEMP/vc-pull/$app" .vercel
            if [ "$app" = api ]; then
              # Vercel detects api/*.js functions before it runs buildCommand; the bundle is gitignored, so build it first.
              pnpm --filter @mfe/api build
            fi
            pnpm dlx "$VERCEL_CLI" build
            if [ "$app" = api ]; then
              [ -n "$(find .vercel/output/functions -name '*.func' -type d 2>/dev/null)" ] || { echo "no function in .vercel/output/functions" >&2; exit 1; }
              # The function lists its installed dependencies as paths in this checkout; ship has none, so inline them.
              node scripts/inline-func-deps.ts
            fi
            # Only the output and the project link go on; never the pulled .env files.
            mkdir -p "$RUNNER_TEMP/vc-out/$app"
            mv .vercel/output .vercel/project.json "$RUNNER_TEMP/vc-out/$app/"
          }
          build api
          for app in $CHANGED; do build "$app"; done
          # The shell's /api rewrite (same origin, no CORS) must reach the preview API: regenerate the configs in this checkout.
          node scripts/vercel-config.ts
          grep -q "$PREVIEW_API_URL" apps/shell/vercel.json
          build shell
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vercel-preview
          path: ${{ runner.temp }}/vc-out
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  ship:
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHANGED: ${{ needs.plan.outputs.changed }}
    steps:
      # Trusted checkout for the repo's plain node scripts only; no `pnpm install` in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vercel-preview
          path: ${{ runner.temp }}/vc-out
      - name: Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/provision.ts preview-db "$PR"
      - name: Per-PR JWT secret
        run: |
          # Per-PR signing key: a token from a preview is worthless on production (and on other PRs).
          jwt=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')
          echo "::add-mask::$jwt"
          echo "JWT_SECRET=$jwt" >> "$GITHUB_ENV"
      - name: Deploy previews
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -eu
          VERCEL_SCOPE=$(node scripts/provision.ts vercel-scope)
          vc() { pnpm dlx "$VERCEL_CLI" "$@" --token "$VERCEL_TOKEN" ${VERCEL_SCOPE:+--scope "$VERCEL_SCOPE"}; }
          # deploy <app> [vercel deploy args]: preview deploy of the prebuilt output, then alias to the stable PR host.
          deploy() {
            app=$1; shift
            host=$(node scripts/preview-urls.ts hosts "$PR" | awk -v a="$app" '$1 == a { print $2 }')
            rm -rf .vercel
            cp -R "$RUNNER_TEMP/vc-out/$app" .vercel
            # The URL is the only stdout of `vercel deploy` (progress goes to stderr).
            url=$(vc deploy --prebuilt -m "pr=$PR" "$@" 2>/tmp/deploy.err) || { cat /tmp/deploy.err >&2; exit 1; }
            echo "$app: $url -> $host"
            # The API must be on the PR's Neon branch before it gets a stable name; on failure no alias is set.
            if [ "$app" = api ]; then node scripts/preview-guard.ts "$url"; fi
            vc alias set "$url" "$host"
          }
          # Runtime env of this deployment only (production secrets target production only): the PR's Neon
          # branch and a per-PR JWT_SECRET. Cron stays off: no cron secret. -m tags the deployment for cleanup.
          deploy api -e "DATABASE_URL=$DATABASE_URL" -e "JWT_SECRET=$JWT_SECRET"
          for app in $CHANGED; do deploy "$app"; done
          deploy shell

  smoke:
    needs: [plan, ship]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHANGED: ${{ needs.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only for PREVIEW_DB_ID (the branch fingerprint the smoke compares against).
      - name: Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/provision.ts preview-db "$PR"
      - run: pnpm exec playwright install --with-deps chromium
      - name: Smoke
        run: |
          # shellcheck disable=SC2086
          eval "$(node scripts/preview-urls.ts env "$PR" $CHANGED | sed 's/^/export /')"
          node scripts/preview-smoke.ts "$PREVIEW_SHELL_URL" "$PREVIEW_API_URL"

  comment:
    needs: [plan, build, ship, smoke]
    # Runs after any outcome except a cancelled run; nothing to say when the plan was skipped (fork, Dependabot).
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
      CHANGED: ${{ needs.plan.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Comment
        env:
          NEEDED: ${{ needs.plan.outputs.needed }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          NEON_OUTCOME: ${{ needs.build.outputs.neon }}
        run: |
          if [ "$NEEDED" != true ]; then
            export STATE=skipped
          elif [ "$SMOKE_RESULT" = success ]; then
            export SMOKE=passed
          elif [ "$SMOKE_RESULT" = failure ]; then
            export SMOKE=failed
          elif [ "$NEON_OUTCOME" = failure ] && [ "$BUILD_RESULT" = failure ]; then
            export UNAVAILABLE="could not create the Neon branch (free-tier branch limit?), see the run"
          else
            export UNAVAILABLE="the build or deploy failed, see the run"
          fi
          node scripts/preview-comment.ts post

  cleanup:
    name: Cleanup (remove preview)
    # Runs on close, never cancelled; waits for a deploy of the same PR that is still running.
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Every step runs even when an earlier one failed, so one failure never leaves the rest behind.
      - name: Delete Neon branch
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/provision.ts preview-db-delete "$PR"
      - name: Remove aliases
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          slug=$(node scripts/provision.ts vercel-scope)
          for host in $(node scripts/preview-urls.ts hosts "$PR" | awk '{ print $2 }'); do
            # A missing alias (app without a preview) is fine.
            pnpm dlx "$VERCEL_CLI" alias rm "$host" --yes --token "$VERCEL_TOKEN" ${slug:+--scope "$slug"} || echo "no alias $host"
          done
      - name: Remove deployments
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          slug=$(node scripts/provision.ts vercel-scope)
          # Deployments tagged with the PR (vercel deploy -m), never a production one.
          for url in $(node scripts/provision.ts preview-deployments "$PR"); do
            pnpm dlx "$VERCEL_CLI" remove "$url" --yes --token "$VERCEL_TOKEN" ${slug:+--scope "$slug"} || echo "could not remove $url"
          done
      - name: Comment
        if: always()
        run: STATE=closed node scripts/preview-comment.ts post
