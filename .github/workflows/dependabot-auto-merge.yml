name: dependabot-auto-merge

# Turns on auto-merge for Dependabot pull requests, by allowlist (scripts/dependabot-merge.ts): every updated
# dependency is semver-patch, or semver-minor of a version >= 1.0.0, and every commit of the PR is by Dependabot.
# GitHub merges them only after every required check of the main protection ruleset is green.
# Everything else (majors, 0.x minors, unknown types) is left for a human. GitHub Actions bumps stay manual too: the workflow token
# may not modify workflow files, so it cannot merge them.

on: pull_request

permissions: {}

jobs:
  auto-merge:
    permissions:
      contents: write
      pull-requests: write
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      # Base commit, never the PR's: this job has a write token and must not run PR code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - id: decide
        run: node scripts/dependabot-merge.ts >> "$GITHUB_OUTPUT"
        env:
          UPDATES: ${{ steps.metadata.outputs.updated-dependencies-json }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.decide.outputs.merge == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
