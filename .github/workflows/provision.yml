name: Provision

# One-time and idempotent: Neon project, four Vercel projects, API env vars, then migrate and seed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provision

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: node scripts/provision.ts
      # Masks the pooled URI, then exports it as DATABASE_URL for the next steps.
      - run: node scripts/provision.ts db-url
      - run: pnpm install --frozen-lockfile --filter @mfe/api...
      - run: pnpm --filter @mfe/api migrate
      - run: pnpm --filter @mfe/api seed
      - name: Smoke, the database has 3 users
        run: |
          n=$(psql "$DATABASE_URL" -tAc 'select count(*) from users')
          echo "users: $n"
          [ "$n" = 3 ]
