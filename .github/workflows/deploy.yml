name: Deploy

# Deploys to Vercel from Actions with the Vercel CLI (no Vercel GitHub app), after CI is green on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Catch-up: dependency-only merges that no deploy picked up reach production within a week.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      apps:
        description: changed (diff since the last successful deploy) or all
        type: choice
        options: [changed, all]
        default: changed

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  VERCEL_CLI: vercel@66.6.0

jobs:
  plan:
    # Only a green push run of CI on main, a weekly catch-up, or a manual run (from main, checked below).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      api: ${{ steps.plan.outputs.api }}
      remotes: ${{ steps.plan.outputs.remotes }}
      shell: ${{ steps.plan.outputs.shell }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      # workflow_run runs on the default branch's latest commit; check out the commit CI actually ran on.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: plan
        env:
          APPS: ${{ inputs.apps || 'changed' }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Diff base (scripts/deploy-base.ts, gh api actions/workflows/deploy.yml/runs): head SHA of the last successful deploy run on main (fails for a manual run off main).
          [ "$EVENT_NAME" != workflow_dispatch ] || [ "$REF" = refs/heads/main ] || { echo "::error::deploy only runs from main (refs/heads/main)"; exit 1; }
          base=$(node scripts/deploy-base.ts)
          if [ "$APPS" != all ] && [ -n "$base" ] && git merge-base --is-ancestor "$base" HEAD; then
            echo "diff base: $base"
            apps=$(git diff --name-only "$base" HEAD | node scripts/changed-apps.ts | tr '\n' ' ')
          else
            echo "no usable diff base, deploying everything"
            apps="api products dashboard orders shell"
          fi
          echo "apps: ${apps:-none}"
          has() { case " $apps " in *" $1 "*) echo true;; *) echo false;; esac; }
          remotes=$(for a in products dashboard orders; do [ "$(has "$a")" = true ] && echo "\"$a\""; done | paste -sd, -)
          {
            echo "api=$(has api)"
            echo "shell=$(has shell)"
            echo "remotes=[$remotes]"
            echo "any=$([ -n "${apps// /}" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  api-build:
    needs: plan
    if: needs.plan.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The deploy token lives only in this step and the ship job's deploy step. It runs before `pnpm install`
      # and uses no repo dependencies, so install scripts and the build never see it.
      - name: Link and pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          slug=$(node scripts/provision.ts vercel-scope)
          scope=(); [ -z "$slug" ] || scope=(--scope "$slug")
          pnpm dlx "$VERCEL_CLI" link --yes --project mfe-lab-api --token "$VERCEL_TOKEN" "${scope[@]}"
          pnpm dlx "$VERCEL_CLI" pull --yes --environment=production --token "$VERCEL_TOKEN" "${scope[@]}"
      - run: pnpm install --frozen-lockfile --filter @mfe/api...
      # Migrate Neon before the new code goes live.
      - run: node scripts/provision.ts db-url
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      - run: pnpm --filter @mfe/api migrate
      - name: Build api
        run: |
          # Vercel detects api/*.js functions before it runs buildCommand; the bundle is gitignored, so build it first.
          pnpm --filter @mfe/api build
          pnpm dlx "$VERCEL_CLI" build --prod
          # Fail loudly instead of deploying a function-less API (every path 404s).
          [ -n "$(find .vercel/output/functions -name '*.func' -type d 2>/dev/null)" ] || { echo "no function in .vercel/output/functions" >&2; exit 1; }
      # Only the build output and the project link; never the pulled .env files.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vercel-api
          path: |
            .vercel/output
            .vercel/project.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  api-ship:
    needs: [plan, api-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Trusted checkout for scripts/provision.ts only; no `pnpm install` in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vercel-api
          path: .vercel
      - name: Deploy api
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          slug=$(node scripts/provision.ts vercel-scope)
          scope=(); [ -z "$slug" ] || scope=(--scope "$slug")
          pnpm dlx "$VERCEL_CLI" deploy --prebuilt --prod --token "$VERCEL_TOKEN" "${scope[@]}"

  remotes-build:
    needs: [plan, api-ship]
    if: ${{ !cancelled() && !failure() && needs.plan.result == 'success' && needs.plan.outputs.remotes != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.remotes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The deploy token lives only in this step and the ship job's deploy step. It runs before `pnpm install`
      # and uses no repo dependencies, so install scripts and the build never see it.
      - name: Link and pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          slug=$(node scripts/provision.ts vercel-scope)
          scope=(); [ -z "$slug" ] || scope=(--scope "$slug")
          pnpm dlx "$VERCEL_CLI" link --yes --project "mfe-lab-${{ matrix.app }}" --token "$VERCEL_TOKEN" "${scope[@]}"
          pnpm dlx "$VERCEL_CLI" pull --yes --environment=production --token "$VERCEL_TOKEN" "${scope[@]}"
      - run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.app }}
        run: |
          pnpm dlx "$VERCEL_CLI" build --prod
      # Only the build output and the project link; never the pulled .env files.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vercel-${{ matrix.app }}
          path: |
            .vercel/output
            .vercel/project.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  remotes-ship:
    needs: [plan, remotes-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.remotes) }}
    steps:
      # Trusted checkout for scripts/provision.ts only; no `pnpm install` in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vercel-${{ matrix.app }}
          path: .vercel
      - name: Deploy ${{ matrix.app }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          slug=$(node scripts/provision.ts vercel-scope)
          scope=(); [ -z "$slug" ] || scope=(--scope "$slug")
          pnpm dlx "$VERCEL_CLI" deploy --prebuilt --prod --token "$VERCEL_TOKEN" "${scope[@]}"

  shell-build:
    needs: [plan, remotes-ship]
    if: ${{ !cancelled() && !failure() && needs.plan.result == 'success' && needs.plan.outputs.shell == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The deploy token lives only in this step and the ship job's deploy step. It runs before `pnpm install`
      # and uses no repo dependencies, so install scripts and the build never see it.
      - name: Link and pull
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          slug=$(node scripts/provision.ts vercel-scope)
          scope=(); [ -z "$slug" ] || scope=(--scope "$slug")
          pnpm dlx "$VERCEL_CLI" link --yes --project "mfe-lab" --token "$VERCEL_TOKEN" "${scope[@]}"
          pnpm dlx "$VERCEL_CLI" pull --yes --environment=production --token "$VERCEL_TOKEN" "${scope[@]}"
      - run: pnpm install --frozen-lockfile
      - name: Build shell
        run: |
          # `vercel build` ignores vercel.json build.env, so pass the remote manifests from the single source of truth.
          MF_PRODUCTS_URL="$(node -p "require('./deploy/urls.json').products")/mf-manifest.json"
          MF_DASHBOARD_URL="$(node -p "require('./deploy/urls.json').dashboard")/mf-manifest.json"
          MF_ORDERS_URL="$(node -p "require('./deploy/urls.json').orders")/mf-manifest.json"
          # The production build refuses preview canaries (deploy/canary.ts).
          export MF_PRODUCTS_URL MF_DASHBOARD_URL MF_ORDERS_URL VERCEL_ENV=production
          pnpm dlx "$VERCEL_CLI" build --prod
          # Fail instead of shipping a shell that points at localhost remotes.
          ! grep -rl 'localhost:300' .vercel/output/static || { echo "localhost remote URL in the shell build" >&2; exit 1; }
      # Only the build output and the project link; never the pulled .env files.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vercel-shell
          path: |
            .vercel/output
            .vercel/project.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  shell-ship:
    needs: [plan, shell-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Trusted checkout for scripts/provision.ts only; no `pnpm install` in this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vercel-shell
          path: .vercel
      - name: Deploy shell
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          slug=$(node scripts/provision.ts vercel-scope)
          scope=(); [ -z "$slug" ] || scope=(--scope "$slug")
          pnpm dlx "$VERCEL_CLI" deploy --prebuilt --prod --token "$VERCEL_TOKEN" "${scope[@]}"

  smoke:
    needs: [plan, shell-ship]
    if: ${{ !cancelled() && !failure() && needs.plan.result == 'success' && needs.plan.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Live URLs
        run: |
          set -eu
          h() { curl -sS --retry 5 --retry-delay 3 --retry-all-errors -D - -o /dev/null "$1"; }
          code() { curl -sS --retry 5 --retry-delay 3 --retry-all-errors -o /dev/null -w '%{http_code}' "$1"; }
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors https://mfe-lab.vercel.app/ | grep -qi '<title>'
          [ "$(code https://mfe-lab.vercel.app/api/health)" = 200 ]
          m=$(h https://mfe-lab-products.vercel.app/mf-manifest.json)
          echo "$m" | head -1 | grep -q ' 200'
          echo "$m" | grep -qi '^access-control-allow-origin: \*'
          echo "$m" | grep -i '^cache-control:' | grep -qi 'no-cache'
          o=$(h https://mfe-lab-orders.vercel.app/mf-manifest.json)
          echo "$o" | head -1 | grep -q ' 200'
          echo "$o" | grep -qi '^access-control-allow-origin: \*'
          echo "$o" | grep -i '^cache-control:' | grep -qi 'no-cache'
          [ "$(code https://mfe-lab-api.vercel.app/cron/reseed)" = 401 ]
          echo smoke ok

  # Lab Web Vitals on the live site (Fast 4G, 4x CPU), budgets in perf-budget.json.
  vitals:
    needs: [plan, smoke]
    if: ${{ !cancelled() && !failure() && needs.plan.result == 'success' && needs.smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Base URL: the shell in deploy/urls.json. Writes the table to the job summary.
      - run: node scripts/vitals.ts
