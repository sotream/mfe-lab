version: 2
# Every entry sets commit-message so PR titles are Conventional Commits (build(deps): ..., ci(deps): ...):
# the title becomes the squash-merge subject on main, and CI checks it (scripts/check-commits.mjs).
# Minor and patch updates get auto-merge (dependabot-auto-merge.yml) once the required checks are green.
# Majors and GitHub Actions bumps stay manual.
updates:
  # pnpm workspace (root, apps/*, packages/*) and the pnpm catalog in pnpm-workspace.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react*'
          - react-router
      federation:
        patterns:
          - '@module-federation/*'
          - '@rspack/*'
      lint-test:
        patterns:
          - eslint*
          - '@eslint/*'
          - typescript-eslint
          - prettier
          - vitest
          - '@testing-library/*'
          - '@playwright/test'
          - jsdom
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only; review TS majors by hand.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Pinned to 6.1.0 on purpose: Vercel parses headers[].source with path-to-regexp 6.1.0, and the
      # header tests must use the same parser (see #56). A major bump would test the wrong syntax.
      - dependency-name: path-to-regexp
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope

  # Base images in the Dockerfile (pinned by digest; Dependabot updates tag and digest together).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
